[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_piper_mit"
version = "0.2.0"
description = "Thin LeRobot robot adapter for RURI Piper MIT teleoperation"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["lerobot_robot_piper_mit*"]
